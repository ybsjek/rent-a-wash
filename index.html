<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Rent-A-Wash offers washer-only rentals for $25 every two weeks, top load washer and dryer rentals starting at $35 every two weeks, and front load rentals starting at $45 every two weeks. Local delivery is $49. Serving Tri-Cities, Benton City, Hermiston, Walla Walla, College Place, and Umatilla."
  >

  <meta name="author" content="Rent-A-Wash">

  <title>Rent-A-Wash | Washer &amp; Dryer Rentals &amp; Repairs</title>

  <style>
    :root {
      --blue: #1f5f9b;
      --blue-dark: #163f68;
      --orange: #f28c28;
      --orange-dark: #a64c00;
      --tan: #f7f2e8;
      --text: #243241;
      --muted: #526170;
      --border: #cbd2d8;
      --white: #ffffff;
      --max: 1160px;
      --sticky-height: 90px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--sticky-height) + 20px);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 32px, var(--max));
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      top: -150px;
      left: 16px;
      padding: 12px 18px;
      color: var(--blue-dark);
      background: var(--white);
      z-index: 2000;
    }

    .skip-link:focus {
      top: 12px;
    }

    a:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 4px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--blue-dark);
      color: var(--white);
      border-bottom: 5px solid var(--orange);
      box-shadow: 0 3px 12px rgb(0 0 0 / 15%);
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding-block: 12px;
    }

    .topbar-inner p {
      margin: 0;
      font-size: 0.95rem;
    }

    .topbar-brand {
      display: block;
      font-weight: 900;
    }

    .apply-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-height: 46px;
      padding: 10px 26px;
      background: var(--orange);
      color: #172b40;
      border: 2px solid var(--orange);
      border-radius: 3px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .apply-link:hover {
      background: #ffac54;
      border-color: #ffac54;
    }

    .apply-link:focus-visible {
      outline-color: var(--white);
    }

    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      padding-block: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 100%;
    }

    .brand img {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
    }

    .brand-name {
      display: block;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--blue-dark);
      line-height: 1.2;
    }

    .brand-description {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .navigation {
      background: var(--blue-dark);
      color: var(--white);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
    }

    .nav-links a {
      display: inline-block;
      padding: 14px 20px;
      font-weight: 800;
    }

    .nav-links a:hover {
      background: var(--blue);
    }

    .hero {
      padding-block: 40px;
      background: var(--tan);
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 28px;
      align-items: stretch;
    }

    .hero-copy {
      padding: 10px 0;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 12px;
      background: #ffe5bf;
      border-left: 5px solid var(--orange);
      color: #703600;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--blue-dark);
      font-size: clamp(2.25rem, 4.5vw, 4rem);
      line-height: 1.08;
      font-weight: 900;
    }

    h1 span {
      color: var(--orange-dark);
    }

    .hero-copy p {
      max-width: 650px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .delivery-highlight {
      margin-block: 22px;
      padding: 16px 18px;
      background: var(--white);
      border-left: 5px solid var(--orange);
    }

    .delivery-highlight strong {
      display: block;
      color: var(--blue-dark);
      font-size: 1.4rem;
    }

    .delivery-highlight span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border: 2px solid transparent;
      border-radius: 3px;
      font-weight: 900;
      text-align: center;
    }

    .btn-primary {
      background: var(--orange);
      border-color: #bd6210;
      color: #172b40;
    }

    .btn-primary:hover {
      background: #ffac54;
    }

    .btn-secondary {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      color: var(--white);
    }

    .btn-secondary:hover {
      background: var(--blue);
      border-color: var(--blue);
    }

    .feature-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 7px solid var(--orange);
      padding: 26px;
    }

    .feature-box h2 {
      margin-top: 0;
      color: var(--blue-dark);
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .feature-list {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
    }

    .feature-list li {
      padding: 13px 0;
      border-top: 1px solid var(--border);
      font-weight: 700;
    }

    .feature-list li::before {
      content: "✓";
      color: var(--blue);
      font-weight: 900;
      margin-right: 10px;
    }

    .section {
      padding-block: 48px;
    }

    .section-title {
      margin-bottom: 26px;
    }

    .section-title h2 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1.2;
    }

    .section-title p {
      margin: 0;
      max-width: 800px;
      color: var(--muted);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      padding: 24px;
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 5px solid var(--blue-dark);
    }

    .card h3 {
      margin: 0 0 12px;
      color: var(--blue-dark);
      font-size: 1.3rem;
    }

    .card p {
      margin-bottom: 0;
    }

    .pricing {
      background: #edf3f8;
      border-block: 1px solid var(--border);
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .price-card {
      display: flex;
      flex-direction: column;
      padding: 26px;
      border: 1px solid var(--border);
      border-top: 7px solid var(--blue-dark);
      background: var(--white);
    }

    .price-card.featured {
      border-top-color: var(--orange);
    }

    .price-badge {
      align-self: flex-start;
      display: inline-block;
      padding: 5px 10px;
      background: var(--tan);
      color: var(--blue-dark);
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .price-card h3 {
      margin-bottom: 8px;
      font-size: 1.6rem;
      line-height: 1.25;
      color: var(--blue-dark);
    }

    .rate-label {
      display: block;
      margin-top: 14px;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .amount {
      margin: 0 0 8px;
      color: var(--blue-dark);
      font-size: 3.1rem;
      line-height: 1.2;
      font-weight: 900;
    }

    .amount span {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .clean {
      list-style: none;
      padding: 0;
      margin: 18px 0 24px;
    }

    .clean li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .price-card .btn {
      margin-top: auto;
      width: 100%;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .delivery-note,
    .repair-note {
      margin-top: 24px;
      padding: 20px;
      background: var(--white);
      border-left: 5px solid var(--orange);
    }

    .delivery-note h3 {
      margin: 0 0 8px;
      color: var(--blue-dark);
      font-size: 1.4rem;
    }

    .delivery-note p,
    .repair-note p {
      margin: 0;
    }
